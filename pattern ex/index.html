<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circle Pattern</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; font-family: sans-serif; }
  .site-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: #312783; color: #EDE8E4; display: flex; align-items: center; justify-content: space-between; padding: 10px 24px; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 14px; font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .site-bar a { color: #EDE8E4; text-decoration: none; display: flex; align-items: center; gap: 6px; transition: opacity 0.2s; }
  .site-bar a:hover { opacity: 0.8; }
  canvas { display: block; width: 100%; height: 100%; }
  .controls {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #312783; color: #EDE8E4;
    padding: 12px 24px; display: flex; gap: 32px;
    flex-wrap: wrap; align-items: center; justify-content: center;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px; font-weight: 700; z-index: 10;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.2);
  }
  .controls .group { display: flex; align-items: center; gap: 10px; }
  .controls label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .controls input[type="range"] { width: 120px; accent-color: #C23F1C; }
  .controls input[type="color"] { width: 36px; height: 28px; border: 2px solid #EDE8E4; border-radius: 4px; cursor: pointer; padding: 0; background: none; }
  .controls .value { min-width: 32px; text-align: right; color: #C23F1C; }
  .controls input[type="checkbox"] { width: 18px; height: 18px; accent-color: #C23F1C; cursor: pointer; }
</style>
</head>
<body>
<div class="site-bar"><a href="../index.html">&larr; Maria&rsquo;s Crafts</a><span>Circle Pattern</span></div>
<canvas id="canvas"></canvas>

<div class="controls">
  <span class="group">
    <span>Cores</span>
    <input type="color" id="color1" value="#312783">
    <input type="color" id="color2" value="#C23F1C">
    <input type="color" id="color3" value="#FFEE8C">
  </span>
  <span class="group">
    <label>Quantidade <input type="range" id="qtySlider" min="4" max="250" value="186"><span class="value" id="qtyVal">186</span></label>
  </span>
  <span class="group">
    <label><input type="checkbox" id="animToggle"> Animado</label>
  </span>
</div>

<script>
"use strict";

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const R_SMALL_BASE = 10;
const R_LARGE_BASE = 30;

let rotRange = Math.PI * 2;
let gap = 2;
let qty = 186;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

function getGroupCircles(rSmall, rLarge, gap) {
  const earDx = rLarge * 0.8 + gap;
  const minVert = rSmall + gap + rLarge;
  const earY = -minVert / 3;
  const headY = -2 * earY;

  return [
    { x: 0,       y: headY, radius: rLarge },
    { x: -earDx,  y: earY,  radius: rSmall },
    { x:  earDx,  y: earY,  radius: rSmall },
  ];
}

function getGroupRadius(circles) {
  let maxDist = 0;
  for (const c of circles) {
    const d = Math.sqrt(c.x * c.x + c.y * c.y) + c.radius;
    if (d > maxDist) maxDist = d;
  }
  return maxDist;
}

function generatePlacements(canvasW, canvasH, circles, extGap) {
  const groupRad = getGroupRadius(circles);
  const step = groupRad * 2 + extGap;
  const cols = Math.ceil(canvasW / step) + 1;
  const rows = Math.ceil(canvasH / step) + 1;
  const offsetX = (canvasW - (cols - 1) * step) / 2;
  const offsetY = (canvasH - (rows - 1) * step) / 2;

  const placements = [];
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const angle = (Math.random() - 0.5) * rotRange;
      placements.push({ cx: offsetX + col * step, cy: offsetY + row * step, angle });
    }
  }

  return placements;
}

function drawGroup(ctx, cx, cy, angle, circles, color) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  ctx.fillStyle = color;

  for (const c of circles) {
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

let animId = null;
let cachedCircles = null;
let cachedPlacements = [];
let cachedPhases = [];

function getPalette() {
  return [
    document.getElementById('color1').value,
    document.getElementById('color2').value,
    document.getElementById('color3').value,
  ];
}

function buildScene() {
  const s = 0.2 + 2.8 * (1 - (qty - 4) / 246);
  const rSmall = R_SMALL_BASE * s;
  const rLarge = R_LARGE_BASE * s;
  const internalGap = gap * s;
  cachedCircles = getGroupCircles(rSmall, rLarge, internalGap);
  cachedPlacements = generatePlacements(canvas.width, canvas.height, cachedCircles, internalGap);
  cachedPhases = cachedPlacements.map(() => Math.random() * 1000);
}

function animate(time) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const palette = getPalette();
  const animated = document.getElementById('animToggle').checked;
  for (let i = 0; i < cachedPlacements.length; i++) {
    const p = cachedPlacements[i];
    const idx = animated ? Math.floor(((time + cachedPhases[i]) * 0.002) % palette.length) : 0;
    drawGroup(ctx, p.cx, p.cy, p.angle, cachedCircles, palette[idx]);
  }

  animId = requestAnimationFrame(animate);
}

const qtySlider = document.getElementById('qtySlider');
const qtyVal = document.getElementById('qtyVal');

function startAnim() {
  if (animId) cancelAnimationFrame(animId);
  buildScene();
  animId = requestAnimationFrame(animate);
}

qtySlider.addEventListener('input', () => {
  qty = Number(qtySlider.value);
  qtyVal.textContent = qty;
  startAnim();
});

document.querySelectorAll('.colors input').forEach(el => {
  el.addEventListener('input', startAnim);
});

document.getElementById('animToggle').addEventListener('change', startAnim);

window.addEventListener('resize', () => {
  resize();
  startAnim();
});

resize();
startAnim();
</script>
</body>
</html>
