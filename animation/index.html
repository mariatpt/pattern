<script>
const state = {
  erro: document.getElementById('erro'),
  v1: ['cara-1', 'sobrancelha-1', 'lingua-1', 'manchas-1'],
  v2: ['cara-2', 'sobrancelha-2', 'lingua-2', 'manchas-2'],
};

let somAtivo = false;
let mix = 0; // 0 = v1, 1 = v2
let smoothRms = 0;
let audioCtx, analyser, dataArray, mediaStream;
let animId = null;
let started = false;

async function iniciarAudio() {
  if (started) return;
  started = true;
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    const source = audioCtx.createMediaStreamSource(mediaStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    source.connect(analyser);
    dataArray = new Uint8Array(analyser.fftSize);
    state.erro.style.display = 'none';
    animId = requestAnimationFrame(loop);
  } catch (err) {
    if (audioCtx) audioCtx.close();
    if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
    state.erro.textContent = 'Microfone nÃ£o disponÃ­vel: ' + err.message;
    state.erro.style.display = 'block';
    started = false;
  }
}

function loop() {
  if (!analyser) return;
  analyser.getByteTimeDomainData(dataArray);
  let sum = 0;
  for (let i = 0; i < dataArray.length; i++) {
    const val = dataArray[i] / 128 - 1;
    sum += val * val;
  }
  const rms = Math.sqrt(sum / dataArray.length);
  smoothRms = smoothRms * 0.92 + rms * 0.08;
  somAtivo = smoothRms > 0.07;
  const alvo = somAtivo ? 1 : 0;
  const passo = 0.025;
  if (mix < alvo) mix = Math.min(mix + passo, alvo);
  if (mix > alvo) mix = Math.max(mix - passo, alvo);
  state.v1.forEach(id => document.getElementById(id).style.opacity = 1 - mix);
  state.v2.forEach(id => document.getElementById(id).style.opacity = mix);
  const pulse = (Math.sin(performance.now() / 4000 * Math.PI * 2) + 1) / 2;
  const amp = 0.12 + mix * 1.2;
  const escala = 1 + pulse * amp;
  document.getElementById('manchas-1').style.transform = 'scale(' + escala + ')';
  document.getElementById('manchas-2').style.transform = 'scale(' + escala + ')';
  animId = requestAnimationFrame(loop);
}

window.addEventListener('beforeunload', () => {
  if (animId) cancelAnimationFrame(animId);
  if (audioCtx) audioCtx.close();
  if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
});

iniciarAudio();
</script>
