<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MARIA'S SITE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root { --cor-1: #312783; --cor-2: #EDE8E4; --cor-3: #C23F1C; }
    /* Reset and base */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #EDE8E4;
      color: #312783;
      overflow-x: hidden;
    }
    ::selection { background: #C23F1C; color: #fff; }

    /* Nav */
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      height: 52px; background: var(--cor-1); z-index: 1000;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 32px;
    }
    nav a {
      flex: 1; text-align: center;
      color: #fff; text-decoration: none; font-size: 14px;
      font-weight: 900; letter-spacing: 0.05em;
      transition: color 0.3s, transform 0.2s;
    }
    nav a:hover { color: var(--cor-3); }
    nav a:active { color: var(--cor-3); transform: scale(1.15); }

    /* Section base */
    section { min-height: 100vh; padding: 80px 48px 48px; }
    /* Hero */
    #hero {
      display: flex; align-items: center; justify-content: flex-start;
      background: var(--cor-2); position: relative; overflow: hidden;
    }
    .hero-title {
      display: flex; flex-direction: column;
      margin-left: 2vw; z-index: 2;
    }
    .hero-line {
      font-family: 'Helvetica Neue', 'Arial Black', sans-serif;
      font-weight: 900; font-size: clamp(4rem, 14vw, 10rem);
      line-height: 0.9; color: #312783; letter-spacing: -0.02em;
      text-transform: uppercase;
    }
    .hero-line:first-child { margin-left: -0.05em; }

    /* Envelopes */
    .envelope {
      position: absolute; width: 120px; cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
      z-index: 3;
    }
    .envelope:hover { transform: scale(1.08); }
    .envelope:active { transform: scale(0.95); }
    #hero:target .envelope { animation: moveIn 0.6s ease both; }
    @keyframes moveIn {
      0% { transform: translateY(30px); opacity: 0.5; }
      100% { transform: translateY(0); opacity: 1; }
    }
    .env-svg { width: 100%; height: auto; display: block; fill: var(--cor-3); }
    .env-svg:active { fill: var(--cor-1); }
    .envelope:active .cls-1 { fill: var(--cor-1); }
    .env-label {
      display: block; text-align: center; margin-top: 6px;
      font-family: 'Helvetica Neue', sans-serif; font-size: 22px; font-weight: 700; color: #312783;
    }
    /* Position envelopes scattered around the title */
    .env-1 { top: 22%; right: 22%; width: 130px; }
    .env-2 { top: 50%; right: 8%; width: 180px; }
    .env-3 { bottom: 12%; right: 25%; width: 160px; }
    .env-4 { top: 30%; right: 35%; width: 160px; }

    /* About & Contact */
    #about { position: relative; background: #312783; }
    #about .section-title,
    #about .section-text { color: #fff; }
    #contact { background: #EDE8E4; }
    .section-content {
      max-width: 720px; margin: 0 auto; padding-top: 10vh;
    }
    .section-title {
      font-family: 'Helvetica Neue', 'Arial Black', sans-serif;
      font-weight: 900; font-size: clamp(2rem, 5vw, 4rem);
      color: #312783; margin-bottom: 32px;
      text-transform: uppercase;
    }
    .section-text {
      font-size: clamp(1.1rem, 2vw, 1.5rem);
      line-height: 1.7; color: #312783;
    }
    .contact-link {
      color: #C23F1C; text-decoration: none;
      border-bottom: 2px solid transparent;
      transition: border-color 0.3s;
    }
    .contact-link:hover { border-color: #C23F1C; }
    .about-decor { position: absolute; bottom: 0; left: 5%; width: 280px; display: flex; flex-direction: column; align-items: center; }
    .about-decor-text { color: var(--cor-3); font-size: 14px; margin-bottom: 4px; font-weight: 700; }
    .about-decor-svg { width: 100%; height: auto; display: block; fill: var(--cor-2); }
    /* Responsive */
    @media (max-width: 900px) {
      section { padding: 72px 32px 32px; }
      .hero-title { margin-left: 5vw; }
      .env-1 { top: 12%; right: 10%; width: 100px; }
      .env-2 { top: 45%; right: 5%; width: 120px; }
      .env-3 { bottom: 25%; right: 15%; width: 130px; }
      .env-4 { top: 28%; right: 25%; width: 120px; }
    }
    @media (max-width: 600px) {
      nav { padding: 0 16px; }
      nav a { font-size: 12px; }
      section { padding: 64px 20px 32px; }
      .hero-title { margin-left: 4vw; }
      .envelope { width: 120px !important; }
      .env-1 { top: 10%; right: 5%; width: 90px !important; }
      .env-2 { top: 40%; right: 3%; }
      .env-3 { bottom: 30%; right: 10%; }
      .env-4 { top: 22%; right: 15%; }
      .env-label { font-size: 16px; }
      .section-content { padding-top: 5vh; }
    }
  </style>
</head>
